<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>AMOLED Meditative Hover Web</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;user-select:none;cursor:none}canvas{display:block;width:100vw;height:100vh;position:absolute;top:0;left:0}</style></head><body><canvas id="c"></canvas><script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}window.addEventListener('resize',resize);resize();const CHUNK=300,DENSITY=20,M=60;let S=1,isDrg=false,pM={x:0,y:0},oX=0,oY=0,mX=null,mY=null,sMX=null,sMY=null;const chunks=new Map();function getChunkKey(cx,cy){return cx+","+cy}function genChunk(cx,cy){const key=getChunkKey(cx,cy);if(chunks.has(key))return chunks.get(key);const n=[];const seed=Math.sin(cx*12.9898+cy*78.233)*43758.5453;let r=seed-Math.floor(seed);for(let i=0;i<DENSITY;i++){r=Math.sin(r*123.456)*43758.5453;r=r-Math.floor(r);const lx=cx*CHUNK+r*CHUNK;r=Math.sin(r*123.456)*43758.5453;r=r-Math.floor(r);const ly=cy*CHUNK+r*CHUNK;n.push({x:lx,y:ly,ox:lx,oy:ly,vx:(r-0.5)*0.25,vy:(Math.sin(r*50)-0.5)*0.25})}chunks.set(key,n);return n}function getActiveNodes(){const cX=canvas.width/2,cY=canvas.height/2;const minCX=Math.floor((oX-cX/S)/CHUNK)-1,maxCX=Math.floor((oX+cX/S)/CHUNK)+1;const minCY=Math.floor((oY-cY/S)/CHUNK)-1,maxCY=Math.floor((oY+cY/S)/CHUNK)+1;let nodes=[];for(let x=minCX;x<=maxCX;x++){for(let y=minCY;y<=maxCY;y++){nodes.push(...genChunk(x,y))}}return nodes}const start=e=>{isDrg=true;const x=e.clientX||(e.touches&&e.touches[0].clientX);const y=e.clientY||(e.touches&&e.touches[0].clientY);pM={x:x,y:y}};const move=e=>{const x=e.clientX||(e.touches&&e.touches[0].clientX),y=e.clientY||(e.touches&&e.touches[0].clientY);if(isDrg){oX-=(x-pM.x)/S;oY-=(y-pM.y)/S;pM={x:x,y:y}}if(x!==undefined){sMX=x;sMY=y;mX=(x-canvas.width/2)/S+oX;mY=(y-canvas.height/2)/S+oY}};const end=()=>{isDrg=false};window.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);window.addEventListener('mouseleave',()=>{isDrg=false;mX=null;mY=null;sMX=null;sMY=null});window.addEventListener('touchstart',start,{passive:true});window.addEventListener('touchmove',move,{passive:true});window.addEventListener('touchend',end);window.addEventListener('wheel',e=>{const oldS=S;S=e.deltaY<0?Math.min(4,S+0.1):Math.max(0.3,S-0.1);const mouseX=e.clientX-canvas.width/2,mouseY=e.clientY-canvas.height/2;oX-=mouseX/oldS-mouseX/S;oY-=mouseY/oldS-mouseY/S});function animate(){ctx.fillStyle='#000000';ctx.fillRect(0,0,canvas.width,canvas.height);const cX=canvas.width/2,cY=canvas.height/2;let activeNodes=getActiveNodes();activeNodes.forEach(n=>{n.ox+=n.vx;n.oy+=n.vy;let tx=n.ox,ty=n.oy;n.nearMouse=false;n.distToMouse=9999;if(mX!==null&&mY!==null){const dx=mX-n.ox,dy=mY-n.oy,d=Math.sqrt(dx*dx+dy*dy);n.distToMouse=d;if(d<M*1.6){n.nearMouse=true;const f=(1-d/(M*1.6))*35;tx+=dx/d*f;ty+=dy/d*f}}n.x+=(tx-n.x)*0.1;n.y+=(ty-n.y)*0.1;n.sX=cX+(n.x-oX)*S;n.sY=cY+(n.y-oY)*S});ctx.lineWidth=Math.max(0.15,0.3*S);ctx.beginPath();for(let i=0;i<activeNodes.length;i++){const n1=activeNodes[i];if(!n1.nearMouse||n1.sX<-M||n1.sX>canvas.width+M||n1.sY<-M||n1.sY>canvas.height+M)continue;if(n1.distToMouse<14)continue;for(let j=i+1;j<activeNodes.length;j++){const n2=activeNodes[j];if(!n2.nearMouse||n2.distToMouse<14)continue;const dx=n1.x-n2.x,dy=n1.y-n2.y;if(Math.abs(dx)<M&&Math.abs(dy)<M){const d=Math.sqrt(dx*dx+dy*dy);if(d<M){ctx.moveTo(n1.sX,n1.sY);ctx.lineTo(n2.sX,n2.sY)}}}}ctx.strokeStyle="rgba(255,255,255,"+(0.25*Math.min(1,S))+")";ctx.stroke();activeNodes.forEach(n=>{if(n.sX>-10&&n.sX<canvas.width+10&&n.sY>-10&&n.sY<canvas.height+10){ctx.beginPath();ctx.arc(n.sX,n.sY,1.1*S,0,Math.PI*2);ctx.fillStyle=n.nearMouse?'#ffffff':'rgba(255,255,255,0.18)';ctx.fill()}});if(sMX!==null&&sMY!==null){ctx.save();ctx.beginPath();ctx.arc(sMX,sMY,4,0,Math.PI*2);ctx.shadowColor='#ffffff';ctx.shadowBlur=18;ctx.fillStyle='#ffffff';ctx.fill();ctx.restore()}requestAnimationFrame(animate)}animate();</script></body></html>
